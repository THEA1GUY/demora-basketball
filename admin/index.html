<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Demora Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="admin-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark"><span>D</span>EMORA</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="players.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Players
      </a>
      <a href="matches.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Matches
      </a>
      <a href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Payments
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="signOutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Dashboard</span>
      <div class="topbar-user">Logged in as <span id="adminEmail">—</span></div>
    </div>
    <div class="content">

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-label">Total Players</div>
          <div class="stat-card-val orange" id="statPlayers">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Upcoming Matches</div>
          <div class="stat-card-val" id="statUpcoming">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Paid This Month</div>
          <div class="stat-card-val green" id="statPaid">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Unpaid This Month</div>
          <div class="stat-card-val red" id="statUnpaid">—</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px">

        <!-- RECENT PLAYERS -->
        <div>
          <div class="page-head" style="margin-bottom:14px">
            <h1 style="font-size:1.1rem;letter-spacing:.06em">Recent Players</h1>
            <a href="players.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Player</th><th>Pos</th><th>PPG</th></tr></thead>
              <tbody id="recentPlayers"><tr><td colspan="3" class="td-main" style="text-align:center;opacity:.4">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>

        <!-- NEXT MATCH -->
        <div>
          <div class="page-head" style="margin-bottom:14px">
            <h1 style="font-size:1.1rem;letter-spacing:.06em">Next Match</h1>
            <a href="matches.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div id="nextMatch" style="background:var(--dark-3);border:1px solid var(--border);border-radius:var(--rl);padding:22px 20px">
            <p style="color:var(--muted);font-size:.82rem">Loading...</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await requireAuth();

  if (db) {
    const { data: { user } } = await db.auth.getUser();
    if (user) document.getElementById('adminEmail').textContent = user.email;

    const thisMonth = new Date(); thisMonth.setDate(1); thisMonth.setHours(0,0,0,0);

    const [{ data: players }, { data: matches }, { data: payments }] = await Promise.all([
      db.from('players').select('id,name,position,ppg,photo_url').eq('is_active',true).order('name'),
      db.from('matches').select('*').order('match_date'),
      db.from('payments').select('paid').gte('month', thisMonth.toISOString().split('T')[0])
    ]);

    // stats
    document.getElementById('statPlayers').textContent = players?.length ?? 0;
    document.getElementById('statUpcoming').textContent = matches?.filter(m=>m.status==='upcoming').length ?? 0;
    document.getElementById('statPaid').textContent   = payments?.filter(p=>p.paid).length ?? 0;
    document.getElementById('statUnpaid').textContent = payments?.filter(p=>!p.paid).length ?? 0;

    // recent players
    const tbody = document.getElementById('recentPlayers');
    if (players?.length) {
      tbody.innerHTML = players.slice(0,5).map(p => `
        <tr>
          <td><div class="player-cell">
            ${p.photo_url ? `<img class="player-thumb" src="../${p.photo_url}" alt="">` : `<div class="player-thumb-ph">${p.name[0]}</div>`}
            <span class="td-main">${p.name}</span>
          </div></td>
          <td><span class="badge badge-pos">${p.position}</span></td>
          <td>${p.ppg}</td>
        </tr>`).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:24px">No players yet.</td></tr>';
    }

    // next match
    const next = matches?.find(m=>m.status==='upcoming');
    const nm   = document.getElementById('nextMatch');
    if (next) {
      nm.innerHTML = `
        <p style="font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin-bottom:10px">Upcoming</p>
        <p style="font-family:var(--ff-d);font-size:1.8rem;letter-spacing:.04em;margin-bottom:8px">vs ${next.opponent}</p>
        <p style="font-size:.82rem;color:var(--muted)">${fmtDate(next.match_date)} &nbsp;·&nbsp; ${fmtTime(next.match_date)}</p>
        <p style="font-size:.82rem;color:var(--muted);margin-top:4px">${next.location || 'Location TBA'}</p>`;
    } else {
      nm.innerHTML = '<p style="color:var(--muted);font-size:.82rem">No upcoming matches scheduled.</p>';
    }
  } else {
    document.getElementById('statPlayers').textContent  = '—';
    document.getElementById('statUpcoming').textContent = '—';
    document.getElementById('statPaid').textContent     = '—';
    document.getElementById('statUnpaid').textContent   = '—';
    document.getElementById('recentPlayers').innerHTML  = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:24px">Connect Supabase to see data.</td></tr>';
    document.getElementById('nextMatch').innerHTML      = '<p style="color:var(--muted);font-size:.82rem">Connect Supabase to see data.</p>';
  }
});
</script>
</body>
</html>
