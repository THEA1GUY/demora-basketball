<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Players — Demora Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="admin-wrap">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark"><span>D</span>EMORA</div><div class="logo-sub">Admin Panel</div></div>
    <nav class="sidebar-nav">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="players.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Players</a>
      <a href="matches.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Matches</a>
      <a href="payments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Payments</a>
    </nav>
    <div class="sidebar-footer"><button id="signOutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Players</span>
    </div>
    <div class="content">
      <div class="page-head">
        <h1>Squad Management</h1>
        <button class="btn btn-primary" id="addPlayerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Player
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th>Position</th>
              <th>No.</th>
              <th>PPG</th>
              <th>RPG</th>
              <th>APG</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="playerTbody">
            <tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-bg" id="playerModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add Player</h2>
      <button class="modal-x" onclick="closeModal('playerModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="pId" />
      <div class="frow">
        <div class="fg"><label>Full Name *</label><input id="pName" type="text" placeholder="Marcus Adeyemi" required /></div>
        <div class="fg">
          <label>Position *</label>
          <select id="pPos">
            <option value="PG">Point Guard</option>
            <option value="SG">Shooting Guard</option>
            <option value="SF">Small Forward</option>
            <option value="PF">Power Forward</option>
            <option value="C">Center</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fg"><label>Jersey Number</label><input id="pNum" type="number" placeholder="3" /></div>
        <div class="fg"><label>Active</label><select id="pActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>
      </div>
      <div class="frow">
        <div class="fg"><label>PPG</label><input id="pPPG" type="number" step="0.1" placeholder="18.4" /></div>
        <div class="fg"><label>RPG</label><input id="pRPG" type="number" step="0.1" placeholder="4.1" /></div>
        <div class="fg"><label>APG</label><input id="pAPG" type="number" step="0.1" placeholder="7.2" /></div>
      </div>
      <div class="fg">
        <label>Profile Photo</label>
        <input id="pPhoto" type="hidden" />
        <div id="photoUploadContainer"></div>
        <p class="fg-hint" id="photoUrlHint" style="font-size:.72rem;color:var(--muted);margin-top:4px"></p>
      </div>
      <div class="fg">
        <label>Gallery Images</label>
        <div id="galleryUploadContainer"></div>
        <input id="pGallery" type="hidden" />
        <p class="fg-hint" style="font-size:.72rem;color:var(--muted);margin-top:4px">Existing URLs: <span id="galleryUrlHint">none</span></p>
      </div>
      <div class="fg"><label>Playing Style</label><textarea id="pStyle" placeholder="Describe the player's playing style..."></textarea></div>
      <div class="fg"><label>Bio / Scouting Notes</label><textarea id="pBio" placeholder="Player background and scouting notes..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('playerModal')">Cancel</button>
      <button class="btn btn-primary" id="savePlayerBtn">Save Player</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<script src="storage-uploads.js"></script>
<script>
let players = [];

async function loadPlayers() {
  const tbody = document.getElementById('playerTbody');
  if (!db) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">Connect Supabase to manage players.</td></tr>';
    return;
  }
  const { data, error } = await db.from('players').select('*').order('name');
  if (error) { toast(error.message, 'error'); return; }
  players = data || [];
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('playerTbody');
  if (!players.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><h3>No players yet</h3><p>Click "Add Player" to get started.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = players.map(p => `
    <tr>
      <td><div class="player-cell">
        ${p.photo_url ? `<img class="player-thumb" src="../${p.photo_url}" alt="">` : `<div class="player-thumb-ph">${p.name[0]}</div>`}
        <span class="td-main">${p.name}</span>
      </div></td>
      <td><span class="badge badge-pos">${p.position}</span></td>
      <td>${p.jersey_number ?? '—'}</td>
      <td>${p.ppg ?? 0}</td>
      <td>${p.rpg ?? 0}</td>
      <td>${p.apg ?? 0}</td>
      <td><span class="badge ${p.is_active ? 'badge-paid' : 'badge-done'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><div class="actions">
        <button class="act-btn" onclick="editPlayer('${p.id}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="act-btn del" onclick="deletePlayer('${p.id}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
      </div></td>
    </tr>`).join('');
}

function clearForm() {
  ['pId','pName','pNum','pPhoto','pGallery','pStyle','pBio','pPPG','pRPG','pAPG'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('pPos').value    = 'PG';
  document.getElementById('pActive').value = 'true';
  document.getElementById('photoUrlHint').textContent  = '';
  document.getElementById('galleryUrlHint').textContent = 'none';
}

function initUploadUIs() {
  if (typeof createImageUploadUI !== 'function') return;
  createImageUploadUI('photoUploadContainer', {
    maxFiles: 1,
    acceptedTypes: 'image/jpeg,image/png,image/webp',
    maxSize: 5 * 1024 * 1024,
    onError: msg => toast(msg, 'error')
  });
  createImageUploadUI('galleryUploadContainer', {
    maxFiles: 6,
    acceptedTypes: 'image/jpeg,image/png,image/webp',
    maxSize: 5 * 1024 * 1024,
    onError: msg => toast(msg, 'error')
  });
}

document.getElementById('addPlayerBtn').addEventListener('click', () => {
  clearForm();
  document.getElementById('modalTitle').textContent = 'Add Player';
  initUploadUIs();
  openModal('playerModal');
});

function editPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pId').value      = p.id;
  document.getElementById('pName').value    = p.name;
  document.getElementById('pPos').value     = p.position;
  document.getElementById('pNum').value     = p.jersey_number ?? '';
  document.getElementById('pPPG').value     = p.ppg ?? '';
  document.getElementById('pRPG').value     = p.rpg ?? '';
  document.getElementById('pAPG').value     = p.apg ?? '';
  document.getElementById('pPhoto').value   = p.photo_url ?? '';
  document.getElementById('pGallery').value = (p.gallery_urls || []).join(', ');
  document.getElementById('photoUrlHint').textContent  = p.photo_url ? `Current: ${p.photo_url}` : 'No photo set';
  document.getElementById('galleryUrlHint').textContent = p.gallery_urls?.length ? p.gallery_urls.join(', ') : 'none';
  document.getElementById('pStyle').value   = p.playing_style ?? '';
  document.getElementById('pBio').value     = p.bio ?? '';
  document.getElementById('pActive').value  = String(p.is_active);
  document.getElementById('modalTitle').textContent = 'Edit Player';
  initUploadUIs();
  openModal('playerModal');
}

async function deletePlayer(id) {
  if (!confirmDelete('Delete this player? This cannot be undone.')) return;
  const { error } = await db.from('players').delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  toast('Player deleted.');
  loadPlayers();
}

document.getElementById('savePlayerBtn').addEventListener('click', async () => {
  const id   = document.getElementById('pId').value;
  const name = document.getElementById('pName').value.trim();
  if (!name) { toast('Name is required.', 'error'); return; }

  const btn = document.getElementById('savePlayerBtn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  // Upload new photo if a file was selected
  let photoUrl = document.getElementById('pPhoto').value.trim() || null;
  const photoInput = document.querySelector('#photoUploadContainer input[type="file"]');
  if (photoInput?.files?.length && id) {
    const res = await uploadPlayerImage(id, photoInput.files[0]);
    if (res.success) photoUrl = res.url;
    else { toast(res.error, 'error'); btn.textContent = 'Save Player'; btn.disabled = false; return; }
  }

  // Upload new gallery images if files were selected
  let galleryUrls = document.getElementById('pGallery').value.split(',').map(s=>s.trim()).filter(Boolean);
  const galleryInput = document.querySelector('#galleryUploadContainer input[type="file"]');
  if (galleryInput?.files?.length && id) {
    const res = await uploadPlayerGallery(id, Array.from(galleryInput.files));
    if (res.success && res.urls.length) galleryUrls = [...galleryUrls, ...res.urls];
  }

  const payload = {
    name,
    position:      document.getElementById('pPos').value,
    jersey_number: parseInt(document.getElementById('pNum').value) || null,
    ppg:           parseFloat(document.getElementById('pPPG').value) || 0,
    rpg:           parseFloat(document.getElementById('pRPG').value) || 0,
    apg:           parseFloat(document.getElementById('pAPG').value) || 0,
    photo_url:     photoUrl,
    gallery_urls:  galleryUrls,
    playing_style: document.getElementById('pStyle').value.trim() || null,
    bio:           document.getElementById('pBio').value.trim() || null,
    is_active:     document.getElementById('pActive').value === 'true',
  };

  const { error } = id
    ? await db.from('players').update(payload).eq('id', id)
    : await db.from('players').insert(payload);

  btn.textContent = 'Save Player'; btn.disabled = false;
  if (error) { toast(error.message, 'error'); return; }
  toast(id ? 'Player updated.' : 'Player added.');
  closeModal('playerModal');
  loadPlayers();
});

document.addEventListener('DOMContentLoaded', async () => {
  await requireAuth();
  loadPlayers();
});
</script>
</body>
</html>
